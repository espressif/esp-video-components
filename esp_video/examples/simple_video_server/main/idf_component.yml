dependencies:
  idf: ">=5.3"
  esp_video:
    override_path: "../../../"
  example_video_common:
    override_path: "../../common_components/example_video_common"
  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common
  espressif/mdns: "^1.0.3"
  # 1.6.4+ loosens esp_hosted to >=2.11 and pulls 3.x, which fails -Werror=unused-function.
  # 1.6.3 keeps esp_hosted >=2.11,<3.0.
  esp_wifi_remote:
    version: "==1.6.3"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: ">=2.11,<3.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/cjson:
    version: "^1.7.15"
    rules:
      - if: "idf_version >= 6.0"