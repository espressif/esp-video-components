name: Bootstrap issue labels (one-time)
on:
  push:
    branches:
      - chore/bootstrap-issue-labels-20261118
permissions:
  issues: write
jobs:
  setup_labels:
    if: github.repository == 'espressif/esp-video-components'
    runs-on: ubuntu-latest
    steps:
      - name: Create and verify requested labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const desired = [
              {
                "name": "type:bug",
                "color": "D73A4A",
                "description": "Confirmed or suspected defect in existing functionality."
              },
              {
                "name": "type:feature",
                "color": "0E8A16",
                "description": "New capability or enhancement request."
              },
              {
                "name": "type:support",
                "color": "D4C5F9",
                "description": "Usage question, troubleshooting, or technical assistance."
              },
              {
                "name": "type:docs",
                "color": "0075CA",
                "description": "Documentation error, omission, or improvement."
              },
              {
                "name": "priority:P1",
                "color": "B60205",
                "description": "High priority: severe regression, crash, corruption, or major blocker."
              },
              {
                "name": "priority:P2",
                "color": "FBCA04",
                "description": "Normal priority: confirmed defect or planned improvement."
              },
              {
                "name": "priority:P3",
                "color": "C2E0C6",
                "description": "Low priority: minor issue or optional enhancement."
              },
              {
                "name": "area:esp_video",
                "color": "1D76DB",
                "description": "esp_video core, V4L2, video pipeline, or device lifecycle."
              },
              {
                "name": "area:esp_cam_sensor",
                "color": "5319E7",
                "description": "Camera sensor drivers, modes, registers, or MIPI/DVP configuration."
              },
              {
                "name": "area:esp_ipa",
                "color": "0F9D91",
                "description": "ISP pipeline, image processing algorithms, calibration, or IQ tuning."
              },
              {
                "name": "area:uvc",
                "color": "0052CC",
                "description": "USB Video Class device/host, streaming, or USB transport."
              },
              {
                "name": "area:h264",
                "color": "006B75",
                "description": "H.264 encoding, bit rate, compression, or buffer management."
              },
              {
                "name": "status:need-info",
                "color": "FEF2C0",
                "description": "Waiting for logs, reproduction details, hardware info, or user response."
              },
              {
                "name": "status:in-progress",
                "color": "FBCA04",
                "description": "Actively being investigated or implemented by an owner."
              },
              {
                "name": "status:verification",
                "color": "BFD4F2",
                "description": "A fix or answer exists; waiting for release or verification."
              },
              {
                "name": "resolution:fixed",
                "color": "0E8A16",
                "description": "Closed after a verified fix; include commit and/or release version."
              },
              {
                "name": "resolution:answered",
                "color": "C5DEF5",
                "description": "Closed after the support question was answered."
              },
              {
                "name": "resolution:unsupported",
                "color": "D4C5F9",
                "description": "Closed because the request is outside the supported scope."
              }
            ];
            const {owner, repo} = context.repo;
            if (owner !== 'espressif' || repo !== 'esp-video-components') throw new Error('Unexpected target repository');
            const getAll = () => github.paginate(github.rest.issues.listLabelsForRepo, {owner, repo, per_page: 100});
            const old = await getAll();
            const existingByName = new Map(old.map(item => [item.name.toLowerCase(), item]));
            for (const label of desired) {
              const existing = existingByName.get(label.name.toLowerCase());
              if (!existing) {
                await github.rest.issues.createLabel({owner, repo, ...label});
                console.log('CREATED ' + label.name);
              } else if (existing.name !== label.name || existing.color.toUpperCase() !== label.color || existing.description !== label.description) {
                await github.rest.issues.updateLabel({owner, repo, name: existing.name, new_name: label.name, color: label.color, description: label.description});
                console.log('UPDATED ' + label.name);
              } else {
                console.log('UNCHANGED ' + label.name);
              }
            }
            const after = new Map((await getAll()).map(item => [item.name.toLowerCase(), item]));
            const missing = desired.filter(label => {
              const found = after.get(label.name.toLowerCase());
              return !found || found.color.toUpperCase() !== label.color || found.description !== label.description;
            });
            if (missing.length) throw new Error('Verification failed for: ' + missing.map(item => item.name).join(', '));
            console.log('SUCCESS: verified all ' + desired.length + ' labels; unrelated labels untouched.');
