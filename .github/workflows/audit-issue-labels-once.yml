name: Audit existing issue labels (one-time)
on:
  push:
    branches:
      - chore/bootstrap-issue-labels-20261118
permissions:
  contents: read
  issues: read
jobs:
  audit_labels:
    if: github.repository == 'espressif/esp-video-components'
    runs-on: ubuntu-latest
    steps:
      - name: Read and report label taxonomy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            if (owner !== 'espressif' || repo !== 'esp-video-components') throw new Error('Unexpected repository');
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const entries = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const issues = entries.filter(x => !x.pull_request);
            const prs = entries.filter(x => x.pull_request);
            const summary = labels.map(x => ({
              name: x.name, description: x.description, color: x.color,
              open: issues.filter(i => i.state === 'open' && i.labels.some(y => y.name === x.name)).length,
              closed: issues.filter(i => i.state === 'closed' && i.labels.some(y => y.name === x.name)).length,
              prs: prs.filter(i => i.labels.some(y => y.name === x.name)).length
            }));
            console.log('AUDIT_LABELS_JSON=' + JSON.stringify({ count: labels.length, issueCount: issues.length, prCount: prs.length, labels: summary }));
